spring.application.name=PPD

spring.boot.admin.client.url=http://localhost:8093
spring.boot.admin.client.username=admin
spring.boot.admin.client.password=admin
spring.boot.admin.client.instance.service-base-url=http://localhost:8080
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

spring.datasource.url=jdbc:postgresql://localhost:5432/storage
spring.datasource.username=app
spring.datasource.password=password
spring.jpa.show-sql=true

## Hibernate Properties
# The SQL dialect makes Hibernate generate better SQL for the chosen database
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto = update



spring.data.mongodb.authentication-database=admin
spring.data.mongodb.database=storage
spring.data.mongodb.username=app
spring.data.mongodb.password=pass

spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017



spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1
