server:
  port: 8080

spring:
  application:
    name: codequest-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/codequest
    username: codequest
    password: codequest_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:alimatari346@gmail.com}
    password: ${MAIL_PASSWORD:dpkklkqctrumvaau}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  jwt:
    secret: ${JWT_SECRET:codequest-super-secret-key-that-must-be-at-least-256-bits-long-for-hs256}
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000

  docker:
    python-image: codequest-python
    node-image: codequest-node
    java-image: codequest-java
    timeout-seconds: 5
    memory-limit-mb: 64

  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173
